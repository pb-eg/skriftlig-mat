<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skriftlig træning · Matematik B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="temml.css">
<style>
/*
VOICE: rolig og saglig som et godt kladdehæfte – eleven skal kunne koncentrere sig.
IDEA: et kvadreret matematikhæfte, hvor læreren har skrevet hints i margenen med blå kuglepen.
PICTURE: selve opgaven med koordinatsystemet tegnet på ternet papir.
COLOUR and TYPE: hvidt papir med svage blå tern, sort blæk, kuglepensblå som accent; Atkinson Hyperlegible.
LAYOUT: én smal kolonne (max 720px), valg øverst, opgaver som ark; stabler naturligt på telefon.
*/
:root{color-scheme:light dark;
 --bg:light-dark(#f7f9fc,#11161f);
 --paper:light-dark(#ffffff,#18202c);
 --grid:light-dark(#e3eaf5,#232d3c);
 --ink:light-dark(#1b1f27,#e9edf3);
 --soft:light-dark(#5b6575,#9aa6b8);
 --line:light-dark(#d5dce7,#2f3a4b);
 --pen:light-dark(#1d4ed8,#7aa2ff);
 --pen-bg:light-dark(#e8efff,#1f2b47);
 --hint:light-dark(#f1f5ff,#1a2438);
 --sol:light-dark(#f4f8f1,#17241b);
 --sol-line:light-dark(#b9d3ad,#2e4a35);
 --red:light-dark(#c7362f,#ff8a80);
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:740px;margin:0 auto;padding:20px max(4vw,14px) 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:15px;color:var(--soft)}
.brand b{color:var(--ink)}
h1{font-size:clamp(30px,6vw,42px);line-height:1.05;margin:4px 0 18px;text-wrap:balance}
h2{font-size:20px;margin:0 0 10px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px clamp(14px,3vw,24px);margin-bottom:16px;box-shadow:0 1px 0 var(--line)}
.muted{color:var(--soft)}
.small{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:16px}
.btn:hover{border-color:var(--pen)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme=dark] .btn.primary{color:#0d1424}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.primary{color:#0d1424}}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;background:none;color:var(--pen);padding-inline:4px}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{justify-content:space-between}

/* Valg af stof */
.area{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--paper)}
.area-head{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px}
.area-head label{flex:1;display:flex;gap:12px;align-items:center;font-weight:700;cursor:pointer}
.area.off .area-head{color:var(--soft)}
.area-sub{padding:0 14px 14px;display:flex;flex-wrap:wrap;gap:8px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pen);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:15px}
.chip[aria-pressed=true]{background:var(--pen-bg);border-color:var(--pen);color:var(--ink)}
.chip[aria-pressed=true]::before{content:"✓";color:var(--pen);font-weight:700}
.chip:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--grid);color:var(--soft);white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:48px;border:0;background:var(--paper);font-size:15px;padding:6px 8px;line-height:1.2}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--pen-bg);color:var(--pen);font-weight:700}
.dots{letter-spacing:2px;color:var(--pen);white-space:nowrap;font-size:14px}
.dots i{font-style:normal;color:var(--line)}
.field{margin:18px 0}
.field>.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.svinfo{margin-top:12px;font-size:15px}.svinfo summary{cursor:pointer;color:var(--pen);font-weight:700;min-height:32px}.svinfo dl{margin:8px 0 0}.svinfo dt{font-weight:700;margin-top:8px}.svinfo dd{margin:2px 0 0}
.startbar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.startbar .btn{width:100%}

/* Opgave */
.taskhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.badge{font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--pen-bg);color:var(--pen);white-space:nowrap}
.intro{margin:0 0 6px}
.fig{margin:10px 0 6px;display:flex;justify-content:center}
.fig svg{display:block;max-width:100%}
.del{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.del.optional .del-text{color:var(--soft)}
.del-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;font-size:14px}
.del-letter{font-weight:700;font-size:17px}
.del-text{margin:0 0 10px}
.note{border-radius:10px;padding:10px 14px;margin:8px 0}
.note.hint{background:var(--hint);border-left:4px solid var(--pen)}
.note.sol{background:var(--sol);border-left:4px solid var(--sol-line)}
.note p{margin:6px 0}
.note .h{font-weight:700;font-size:14px;color:var(--soft);margin-bottom:2px}
math.tml-display{margin:8px 0;overflow-x:auto;overflow-y:hidden;padding-block:2px}
.rate{margin-top:10px}
.rate .q{font-weight:700;font-size:15px;margin-bottom:6px}
.rate-list{display:grid;gap:6px}
.rate-list button{display:flex;gap:10px;align-items:center;text-align:left;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:15px}
.rate-list button .sw{width:14px;height:14px;border-radius:4px;flex:none}
.rate-list button[aria-pressed=true]{border-color:var(--pen);background:var(--pen-bg);font-weight:700}
.saved{font-size:14px;color:var(--soft);margin-top:6px}
.navbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}

/* Oversigt */
.stat{padding:10px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.stat-top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--grid);margin:6px 0 2px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px;font-size:13px;color:var(--soft);margin-top:10px}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.banner{background:var(--pen-bg);color:var(--pen);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;margin-bottom:14px}
.confirm{display:none;margin-top:10px}
.confirm.on{display:flex}
.empty{text-align:center;padding:24px 8px}
@media(max-width:600px){body{font-size:16px}.seg button{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Skriftlig træning</b> · Matematik B</div>
    <button class="btn link" id="toOverview" type="button">Min oversigt</button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<script src="temml.min.js"></script>
<script src="pensum.js"></script>
<script src="opgaver.js"></script>
<script>
{
// ---------- data og hjælpere ----------
const PENSUM = window.PENSUM || [], KAT = window.KATEGORIER || [], OPG = window.OPGAVER || [];
const LAERER = location.hash === "#alt";
const gennemgaaet = new Set(PENSUM.filter(p => p.gennemgaaet).map(p => p.id));
const underNavn = {}; KAT.forEach(k => k.under.forEach(u => underNavn[u.id] = u.navn));
const omraadeAf = {}; KAT.forEach(k => k.under.forEach(u => omraadeAf[u.id] = k.id));

const VURDERING = [
  { v: 1, txt: "Forstod ikke opgaven",                       c: "#b42318" },
  { v: 2, txt: "Forstod opgaven, men havde ingen idé til at komme i gang", c: "#d9480f" },
  { v: 3, txt: "Kom i gang, men ikke i mål",                 c: "#e8a21a" },
  { v: 4, txt: "Kom i mål, men lavede en metodefejl",        c: "#a3a32b" },
  { v: 5, txt: "Kom i mål, men lavede en regnefejl",         c: "#6aa84f" },
  { v: 6, txt: "Kunne hele vejen",                           c: "#2f855a" }
];

const LS = "mbtraening.v1";
let store = { forsoeg: [] };
let lagringVirker = true;
try { const s = localStorage.getItem(LS); if (s) store = JSON.parse(s); if (!Array.isArray(store.forsoeg)) store = { forsoeg: [] }; }
catch (e) { lagringVirker = false; }
const gem = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) { lagringVirker = false; } };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function mat(s) {
  const tex = (t, d) => { try { return temml.renderToString(t, { displayMode: d }); } catch (e) { return "<code>" + esc(t) + "</code>"; } };
  return String(s).replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => tex(t, true)).replace(/\$([^$]+?)\$([.,:;?!)]?)/g, (_, t, p) => p ? '<span style="white-space:nowrap">' + tex(t, false) + p + "</span>" : tex(t, false));
}
const dots = n => '<span class="dots" title="Sværhedsgrad ' + n + ' af 3" aria-label="Sværhedsgrad ' + n + ' af 3">' + "●".repeat(n) + "<i>" + "●".repeat(3 - n) + "</i></span>";
const delKey = (o, d) => o.id + "|" + d.bogstav;
const delOpen = d => LAERER || d.kraever.every(f => gennemgaaet.has(f));

// ---------- valg (huskes mellem besøg) ----------
let valg = { under: [], delproeve: 0, sv: [1, 2, 3] };
try { const v = JSON.parse(localStorage.getItem(LS + ".valg")); if (v && Array.isArray(v.under)) valg = v; } catch (e) {}
const gemValg = () => { try { localStorage.setItem(LS + ".valg", JSON.stringify(valg)); } catch (e) {} };

// En underkategori er tilgængelig, hvis mindst én åben delopgave har den
const tilgaengelig = new Set();
OPG.forEach(o => o.dele.forEach(d => { if (delOpen(d)) tilgaengelig.add(d.kategori); }));
valg.under = valg.under.filter(u => tilgaengelig.has(u));

const iValg = d => valg.under.includes(d.kategori) && valg.sv.includes(d.sv) && delOpen(d);
function matchende() {
  return OPG.filter(o => (!valg.delproeve || o.delproeve === valg.delproeve) && o.dele.some(iValg));
}

// ---------- prioritering: ukendte først, derefter de svageste ----------
function seneste(key) {
  for (let i = store.forsoeg.length - 1; i >= 0; i--) if (store.forsoeg[i].key === key) return store.forsoeg[i];
  return null;
}
function prioritet(o) {
  const relevante = o.dele.filter(iValg);
  let min = Infinity, set = false;
  relevante.forEach(d => { const f = seneste(delKey(o, d)); if (f) { set = true; min = Math.min(min, f.v - (f.h > 0 ? 0.5 : 0)); } else min = -1; });
  return set ? min : -1;
}
function koe() {
  return matchende().map(o => ({ o, p: prioritet(o) + Math.random() * 0.4 })).sort((a, b) => a.p - b.p).map(x => x.o);
}

// ---------- figurer ----------
function tegnFigur(svg, f) {
  const [x0, x1, y0, y1] = f.vindue, xs = x1 - x0, ys = y1 - y0;
  const maxW = Math.min(svg.parentElement.clientWidth || 320, 520);
  let s = maxW / xs; if (ys * s > 420) s = 420 / ys;
  const W = Math.round(xs * s), H = Math.round(ys * s);
  const X = x => (x - x0) * s, Y = y => (y1 - y) * s;
  const cs = getComputedStyle(document.documentElement);
  const grid = cs.getPropertyValue("--grid").trim() ? "var(--grid)" : "#e3eaf5";
  const step = xs > 16 || ys > 16 ? 2 : 1, lbl = xs > 16 || ys > 16 ? 4 : 2;
  // Skitse som standard (ingen tern, ingen tal). Kun aflæsningsopgaver (figur.aflaes) får tern og tal.
  let g = "", ax = "";
  if (f.aflaes) {
    for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) g += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}" stroke="${grid}"/>`;
    for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) g += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" stroke="${grid}"/>`;
  }
  const hasX = y0 <= 0 && y1 >= 0, hasY = x0 <= 0 && x1 >= 0;
  if (hasX) ax += `<line x1="0" y1="${Y(0)}" x2="${W - 2}" y2="${Y(0)}" stroke="var(--soft)" stroke-width="1.4"/><path d="M${W - 1} ${Y(0)} l-9 -4.5 v9 z" fill="var(--soft)"/><text x="${W - 12}" y="${Y(0) + 17}" font-size="15" font-style="italic" fill="var(--soft)">x</text>`;
  if (hasY) ax += `<line x1="${X(0)}" y1="${H}" x2="${X(0)}" y2="2" stroke="var(--soft)" stroke-width="1.4"/><path d="M${X(0)} 1 l-4.5 9 h9 z" fill="var(--soft)"/><text x="${X(0) + 9}" y="15" font-size="15" font-style="italic" fill="var(--soft)">y</text>`;
  const fs = 13;
  if (f.aflaes) {
    if (hasX) for (let x = Math.ceil(x0 / lbl) * lbl; x <= x1; x += lbl) if (x !== 0 && x > x0 && x < x1) ax += `<text x="${X(x)}" y="${Y(0) + fs + 2}" font-size="${fs}" text-anchor="middle" fill="var(--soft)">${x}</text>`;
    if (hasY) for (let y = Math.ceil(y0 / lbl) * lbl; y <= y1; y += lbl) if (y !== 0 && y > y0 && y < y1) ax += `<text x="${X(0) - 5}" y="${Y(y) + 4}" font-size="${fs}" text-anchor="end" fill="var(--soft)">${y}</text>`;
  }
  let ob = "", top = "";
  f.objekter.forEach(e => {
    if (e.t === "linje") {
      ob += `<line x1="${X(x0)}" y1="${Y(e.a * x0 + e.b)}" x2="${X(x1)}" y2="${Y(e.a * x1 + e.b)}" stroke="var(--pen)" stroke-width="2.2"/>`;
      if (e.navn) { // placér navnet nær den kant, hvor linjen forlader vinduet
        let xn = x1 - xs * 0.06, yn = e.a * xn + e.b;
        if (yn > y1 - ys * 0.06 || yn < y0 + ys * 0.06) { yn = e.a > 0 ? y1 - ys * 0.07 : y0 + ys * 0.07; xn = (yn - e.b) / e.a; }
        top += `<text x="${Math.min(X(xn) + 8, W - 20)}" y="${Y(yn) - 6}" font-size="15" font-style="italic" font-weight="700" fill="var(--pen)">${e.navn}</text>`;
      }
    } else if (e.t === "lodret") {
      ob += `<line x1="${X(e.x)}" y1="0" x2="${X(e.x)}" y2="${H}" stroke="var(--pen)" stroke-width="2.2"/>`;
      if (e.navn) top += `<text x="${X(e.x) + 7}" y="18" font-size="15" font-style="italic" font-weight="700" fill="var(--pen)">${e.navn}</text>`;
    } else if (e.t === "stykke") {
      ob += `<line x1="${X(e.x1)}" y1="${Y(e.y1)}" x2="${X(e.x2)}" y2="${Y(e.y2)}" stroke="var(--ink)" stroke-width="2"/>`;
    } else if (e.t === "cirkel") {
      ob += `<circle cx="${X(e.cx)}" cy="${Y(e.cy)}" r="${e.r * s}" fill="none" stroke="var(--red)" stroke-width="2.2"/>`;
      if (e.navn) top += `<text x="${X(e.cx + e.r * 0.72) + 4}" y="${Y(e.cy + e.r * 0.72) - 4}" font-size="15" font-weight="700" fill="var(--red)" paint-order="stroke" stroke="var(--paper)" stroke-width="4">${e.navn}</text>`;
    } else if (e.t === "punkt") {
      top += `<circle cx="${X(e.x)}" cy="${Y(e.y)}" r="4.5" fill="var(--ink)" stroke="var(--paper)" stroke-width="1.5"/>`;
      if (e.navn) top += `<text x="${X(e.x) + 8}" y="${Y(e.y) - 8}" font-size="15" font-weight="700" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="4">${e.navn}</text>`;
    }
  });
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const id = "c" + Math.random().toString(36).slice(2, 8);
  svg.innerHTML = `<defs><clipPath id="${id}"><rect width="${W}" height="${H}"/></clipPath></defs><rect width="${W}" height="${H}" fill="var(--paper)" stroke="var(--line)"/><g clip-path="url(#${id})">${g}${ax}${ob}${top}</g>`;
}
let figurer = [];
const ro = new ResizeObserver(() => figurer.forEach(([svg, f]) => tegnFigur(svg, f)));

// ---------- visninger ----------
const view = document.getElementById("view");
document.getElementById("banner").innerHTML = LAERER ? '<div class="banner">Lærervisning: alt stof vises, uanset hvad der er krydset af i pensum.</div>' : "";
document.getElementById("toOverview").addEventListener("click", visOversigt);

function visStart() {
  figurer = []; ro.disconnect();
  const omr = KAT.map(k => {
    const subs = k.under, aabne = subs.filter(u => tilgaengelig.has(u.id));
    const alleValgt = aabne.length && aabne.every(u => valg.under.includes(u.id));
    if (k.kommer) return "";
    if (!aabne.length) return `<div class="area off"><div class="area-head"><label><input type="checkbox" disabled> ${esc(k.navn)}</label><span class="tag">${k.kommer ? "Kommer senere" : "Ikke gennemgået"}</span></div></div>`;
    return `<div class="area"><div class="area-head"><label><input type="checkbox" data-omr="${k.id}" ${alleValgt ? "checked" : ""}> ${esc(k.navn)}</label><span class="small muted">blandet eller vælg selv</span></div>
      <div class="area-sub">${subs.map(u => {
        const aaben = tilgaengelig.has(u.id);
        return `<button type="button" class="chip" data-under="${u.id}" aria-pressed="${valg.under.includes(u.id)}" ${aaben ? "" : 'disabled title="Ikke gennemgået endnu"'}>${esc(u.navn)}</button>`;
      }).join("")}</div></div>`;
  }).join("");
  const n = matchende().length;
  view.innerHTML = `
    <h1>Hvad vil du træne?</h1>
    <div class="field"><span class="lbl">Stof</span>${omr}${KAT.some(k => k.kommer) ? `<p class="small muted">Kommer senere: ${KAT.filter(k => k.kommer).map(k => esc(k.navn)).join(" · ")}</p>` : ""}</div>
    <div class="field"><span class="lbl">Delprøve</span>
      <div class="seg" role="group">${[[0, "Begge"], [1, "Delprøve 1<br><span class=small>i hånden</span>"], [2, "Delprøve 2<br><span class=small>med CAS</span>"]].map(([v, t]) => `<button type="button" data-dp="${v}" aria-pressed="${valg.delproeve === v}">${t}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl">Sværhedsgrad <span class="muted small">(efter hvor mange trin opgaven har)</span></span>
      <div class="row">${[1, 2, 3].map(v => `<button type="button" class="chip" data-sv="${v}" aria-pressed="${valg.sv.includes(v)}">${dots(v)}</button>`).join("")}</div>
      <details class="svinfo"><summary>Hvad betyder sværhedsgraderne?</summary>
        <dl>
          <dt>${dots(1)} Grundlæggende</dt><dd>Én nem beregning eller aflæsning. Det mest simple at få styr på, men grad 1 alene er ikke nok til at bestå.</dd>
          <dt>${dots(2)} Kernen i eksamen</dt><dd>En sværere formel eller flere trin. Langt de fleste eksamensopgaver ligger her. Grad 2-opgaverne vil gøre forskellen fra 02 til 10.</dd>
          <dt>${dots(3)} Udfordrende</dt><dd>Mange trin, eller en idé du selv skal finde. Der er kun få af dem i et eksamenssæt, og det er typisk her, 12-tallet bliver afgjort.</dd>
        </dl>
        <p class="small muted">Karakteren afhænger af hele besvarelsen, og pointgrænserne fastsættes for hvert eksamenssæt.</p>
      </details></div>
    ${lagringVirker ? "" : '<p class="small muted">Din browser tillader ikke, at appen gemmer dine vurderinger. Du kan stadig træne.</p>'}
    <div class="startbar"><button class="btn primary" id="start" type="button" ${n ? "" : "disabled"}>${n ? `Start · ${n} opgave${n === 1 ? "" : "r"}` : (valg.under.length ? "Ingen opgaver matcher dit valg" : "Vælg noget stof først")}</button></div>`;
  view.querySelectorAll("[data-under]").forEach(b => b.addEventListener("click", () => {
    const u = b.dataset.under; valg.under = valg.under.includes(u) ? valg.under.filter(x => x !== u) : [...valg.under, u]; gemValg(); visStart();
  }));
  view.querySelectorAll("[data-omr]").forEach(c => c.addEventListener("change", () => {
    const k = KAT.find(k => k.id === c.dataset.omr), ids = k.under.map(u => u.id).filter(u => tilgaengelig.has(u));
    valg.under = c.checked ? [...new Set([...valg.under, ...ids])] : valg.under.filter(u => !ids.includes(u)); gemValg(); visStart();
  }));
  view.querySelectorAll("[data-dp]").forEach(b => b.addEventListener("click", () => { valg.delproeve = +b.dataset.dp; gemValg(); visStart(); }));
  view.querySelectorAll("[data-sv]").forEach(b => b.addEventListener("click", () => {
    const v = +b.dataset.sv; valg.sv = valg.sv.includes(v) ? valg.sv.filter(x => x !== v) : [...valg.sv, v].sort(); gemValg(); visStart();
  }));
  const st = document.getElementById("start"); if (st) st.addEventListener("click", () => { Object.keys(tilstand).forEach(k => delete tilstand[k]); session = { koe: koe(), i: 0, fokus: {} }; visOpgave(); });
}

let session = null;
const tilstand = {}; // pr. delopgave i denne session: hints vist, løsning vist, vurdering

function visOpgave() {
  const { koe: q, i } = session;
  if (i >= q.length) return visSlut();
  const o = q[i];
  figurer = []; ro.disconnect();
  const dele = o.dele.filter(delOpen);
  view.innerHTML = `
    <div class="taskhead"><button class="btn link" id="back" type="button">← Skift valg</button><span class="small muted">Opgave ${i + 1} af ${q.length}</span></div>
    <article class="sheet">
      <div class="row spread" style="margin-bottom:10px"><span class="badge">${o.delproeve === 1 ? "Delprøve 1 · i hånden" : "Delprøve 2 · med CAS"}</span><span class="row">${o.opgave1 ? '<span class="tag">Opgave 1-format</span>' : ""}${LAERER ? `<span class="tag">${esc(o.id)}${o.forlaeg ? " · " + esc(o.forlaeg) : " · egen variant"}</span>` : ""}</span></div>
      ${o.intro ? `<p class="intro">${mat(o.intro)}</p>` : ""}
      ${o.figur ? '<div class="fig"><svg role="img" aria-label="Figur til opgaven"></svg></div>' : ""}
      ${dele.map(d => delHTML(o, d)).join("")}
    </article>
    <div class="navbar"><button class="btn" id="prev" type="button" ${i ? "" : "disabled"}>Forrige</button><button class="btn primary" id="next" type="button">${i + 1 < q.length ? "Næste opgave" : "Afslut"}</button></div>`;
  if (o.figur) { const svg = view.querySelector(".fig svg"); figurer.push([svg, o.figur]); tegnFigur(svg, o.figur); ro.observe(view); }
  document.getElementById("back").addEventListener("click", visStart);
  document.getElementById("prev").addEventListener("click", () => { session.i--; visOpgave(); scrollTo(0, 0); });
  document.getElementById("next").addEventListener("click", () => { session.i++; visOpgave(); scrollTo(0, 0); });
  dele.forEach(d => bindDel(o, d));
}

function delHTML(o, d) {
  const k = delKey(o, d), t = tilstand[k] || (tilstand[k] = { hints: 0, sol: false, v: 0 });
  const opt = !iValg(d) && !(session && session.fokus[o.id] === d.kategori);
  return `<section class="del ${opt ? "optional" : ""}" data-key="${esc(k)}">
    <div class="del-meta">${d.bogstav ? `<span class="del-letter">${d.bogstav})</span>` : ""}<span class="tag">${d.point} point</span>${dots(d.sv)}<span class="muted">${esc(underNavn[d.kategori] || "")}</span>${opt ? '<span class="tag">uden for dit valg – kan springes over</span>' : ""}</div>
    <p class="del-text">${mat(d.tekst)}</p>
    <div class="del-body">${delBody(o, d, t)}</div>
  </section>`;
}
function delBody(o, d, t) {
  let h = "";
  for (let n = 0; n < t.hints; n++) h += `<div class="note hint"><div class="h">Hint ${n + 1}</div>${mat(d.hints[n])}</div>`;
  if (t.sol) h += `<div class="note sol"><div class="h">Løsning</div>${mat(d.loesning)}</div>`;
  const knapper = [];
  if (!t.sol && t.hints < d.hints.length) knapper.push(`<button class="btn" type="button" data-act="hint">Vis hint ${t.hints + 1}</button>`);
  if (!t.sol) knapper.push(`<button class="btn" type="button" data-act="sol">Vis løsning</button>`);
  if (knapper.length) h += `<div class="row">${knapper.join("")}</div>`;
  if (t.sol) {
    h += `<div class="rate"><div class="q">Hvordan gik det?</div><div class="rate-list">${VURDERING.map(r => `<button type="button" data-v="${r.v}" aria-pressed="${t.v === r.v}"><span class="sw" style="background:${r.c}"></span>${r.txt}</button>`).join("")}</div>
      ${lignendeKandidater(o, d).length ? `<div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="lignende">Giv mig en lignende opgave</button></div>` : ""}
      ${t.v ? `<div class="saved">Gemt${t.hints ? ` · du brugte ${t.hints} hint${t.hints > 1 ? "s" : ""}` : " · uden hints"}${lagringVirker ? "" : " (kun i denne session)"}.</div>` : ""}</div>`;
  }
  return h;
}
function bindDel(o, d) {
  const k = delKey(o, d), t = tilstand[k];
  const sec = [...view.querySelectorAll(".del")].find(s => s.dataset.key === k);
  const body = sec.querySelector(".del-body");
  body.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.act === "hint") t.hints++;
    else if (b.dataset.act === "sol") t.sol = true;
    else if (b.dataset.act === "lignende") { lignende(o, d); return; }
    else if (b.dataset.v) {
      const v = +b.dataset.v, ny = { key: k, o: o.id, d: d.bogstav, k: d.kategori, dp: o.delproeve, sv: d.sv, v, h: t.hints, t: Date.now() };
      if (t.v && t.idx != null && store.forsoeg[t.idx] && store.forsoeg[t.idx].key === k) store.forsoeg[t.idx] = ny; // ret vurdering i samme forsøg
      else { store.forsoeg.push(ny); t.idx = store.forsoeg.length - 1; }
      t.v = v; gem();
    } else return;
    body.innerHTML = delBody(o, d, t);
  });
}

// "Giv mig en lignende opgave": samme underkategori, helst ikke set i denne session, helst samme delprøve
function lignendeKandidater(o, d) {
  return OPG.filter(x => x.id !== o.id && x.dele.some(y => y.kategori === d.kategori && delOpen(y)));
}
function lignende(o, d) {
  const sete = new Set(session.koe.slice(0, session.i + 1).map(x => x.id));
  const score = x => (sete.has(x.id) ? 10 : 0) + (x.delproeve === o.delproeve ? 0 : 3) + Math.max(prioritet(x), -1) + Math.random();
  const valgt = lignendeKandidater(o, d).sort((a, b) => score(a) - score(b))[0];
  if (!valgt) return;
  session.fokus[valgt.id] = d.kategori;
  session.koe.splice(session.i + 1, 0, valgt);
  // nulstil visningen af den nye opgave, hvis den har været vist før i sessionen
  valgt.dele.forEach(y => delete tilstand[delKey(valgt, y)]);
  session.i++; visOpgave(); scrollTo(0, 0);
}

function visSlut() {
  figurer = []; ro.disconnect();
  view.innerHTML = `<div class="sheet empty"><h1>Godt arbejde</h1><p>Du har været alle opgaverne i dit valg igennem.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="igen" type="button">Træn igen</button><button class="btn" id="ov" type="button">Se din oversigt</button><button class="btn" id="nyt" type="button">Skift valg</button></div></div>`;
  document.getElementById("igen").addEventListener("click", () => { Object.keys(tilstand).forEach(k => delete tilstand[k]); session = { koe: koe(), i: 0, fokus: {} }; visOpgave(); });
  document.getElementById("ov").addEventListener("click", visOversigt);
  document.getElementById("nyt").addEventListener("click", visStart);
}

function visOversigt() {
  figurer = []; ro.disconnect();
  // seneste vurdering pr. delopgave tæller
  const sidste = {}; store.forsoeg.forEach(f => sidste[f.key] = f);
  const rows = KAT.filter(k => !k.kommer).map(k => `<div class="sheet"><h2>${esc(k.navn)}</h2>${k.under.map(u => {
    const fs = Object.values(sidste).filter(f => f.k === u.id), n = fs.length;
    const total = OPG.reduce((s, o) => s + o.dele.filter(d => d.kategori === u.id && delOpen(d)).length, 0);
    if (!total && !n) return "";
    const fordeling = VURDERING.map(r => fs.filter(f => f.v === r.v).length);
    const hint = n ? Math.round(100 * fs.filter(f => f.h > 0).length / n) : 0;
    return `<div class="stat"><div class="stat-top"><span>${esc(u.navn)}</span><span class="muted small">${n} af ${total} prøvet</span></div>
      <div class="bar">${n ? fordeling.map((c, j) => c ? `<span style="width:${100 * c / n}%;background:${VURDERING[j].c}" title="${VURDERING[j].txt}: ${c}"></span>` : "").join("") : ""}</div>
      ${n ? `<div class="small muted">Hints brugt i ${hint} % · hele vejen: ${fordeling[5]} af ${n}</div>` : ""}</div>`;
  }).join("")}</div>`).join("");
  view.innerHTML = `<div class="taskhead"><button class="btn link" id="back" type="button">← Tilbage</button></div>
    <h1>Min oversigt</h1><p class="muted">Din seneste vurdering af hver delopgave. Alt gemmes kun på denne enhed.</p>
    <div class="legend" style="margin-bottom:14px">${VURDERING.map(r => `<span><i style="background:${r.c}"></i>${r.txt}</span>`).join("")}</div>
    ${rows}
    <div class="sheet"><button class="btn" id="reset" type="button">Slet mine vurderinger</button>
      <div class="confirm row" id="confirm"><span>Er du sikker? Det kan ikke fortrydes.</span><button class="btn primary" id="ja" type="button">Ja, slet</button><button class="btn" id="nej" type="button">Annullér</button></div></div>`;
  document.getElementById("back").addEventListener("click", () => session && session.i < session.koe.length ? visOpgave() : visStart());
  document.getElementById("reset").addEventListener("click", () => document.getElementById("confirm").classList.add("on"));
  document.getElementById("nej").addEventListener("click", () => document.getElementById("confirm").classList.remove("on"));
  document.getElementById("ja").addEventListener("click", () => { store = { forsoeg: [] }; gem(); Object.keys(tilstand).forEach(k => delete tilstand[k]); visOversigt(); });
}

visStart();
}
</script>
</body>
</html>
